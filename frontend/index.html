<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Too Many Hobbies</title>
  <link rel="stylesheet" href="index.css">
  </link>
  <script>
    var ENV_PROD = location.hostname !== "127.0.0.1";
  </script>
  <script type="module" src="index.js"></script>
  <script src="util.js"></script>
</head>

<body>
  <section id="welcome-container">
    <h1>
      Hey, I'm Ivan 👋
    </h1>
    <p>
      Welcome to my little corner of the
      internet. This is where I track the things I love — movies I watch, miles I ride and run, and the records I
      collect. A living dashboard of my hobbies.
    </p>
  </section>
  <!--
    Widgets are grouped by hobby. Within a group they flow into as many columns
    as the width allows, so nothing here needs rebalancing when a widget is
    added or grows. Grouping also keeps related widgets together — Cycling beside
    its bikes, Records beside the hi-fi that plays them — which a single
    height-balanced layout pulled apart.
  -->
  <div id="widgets-container">
    <section class="widget-group">
      <h2 class="widget-group-title">Activities</h2>
      <div class="widget-group-grid">
        <div id="cycling-component"></div>
        <div id="running-component"></div>
        <div id="gear-component"></div>
      </div>
    </section>

    <section class="widget-group">
      <h2 class="widget-group-title">Media</h2>
      <div class="widget-group-grid">
        <div id="film-component"></div>
        <div id="music-component"></div>
        <div id="hifi-component"></div>
      </div>
    </section>

    <section class="widget-group">
      <h2 class="widget-group-title">Misc</h2>
      <div class="widget-group-grid">
        <div id="lego-component"></div>
      </div>
    </section>
  </div>
</body>

</html>
