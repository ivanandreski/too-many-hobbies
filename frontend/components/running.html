<div class="widget-container">
  <div id="running-summary" class="widget-summary">
    <h2>🏃 Running</h2>
    <p>
      I try to keep the running consistent too. Not as fast as on the bike, but it keeps me balanced and clears my
      head.
    </p>
  </div>
  <div id="widget-running" class="widget">
    <!-- Same markup as the cycling widget; only data-strava-sport differs. -->
    <div class="strava-widget" data-strava-widget data-strava-sport="running">
      <div class="strava-header">
        <div class="strava-header-left">
          <div class="strava-icon-circle"><span class="strava-icon-emoji">🏃</span></div>
          <div>
            <h2 class="strava-title">Running</h2>
            <p class="strava-subtitle">Strava · <span data-strava-period></span></p>
          </div>
        </div><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-chevron-right strava-chevron">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </div>
      <!-- Running has a single group, so strava.js leaves this tab bar hidden. -->
      <div class="strava-tabs" data-strava-tabs role="tablist" hidden>
        <template data-strava-tab-template>
          <button type="button" class="strava-tab" role="tab"></button>
        </template>
      </div>
      <div class="strava-stats-row">
        <div class="strava-stat-bordered">
          <p class="strava-stat-value"><span data-strava-distance></span><span class="strava-stat-unit">km</span></p>
          <p class="strava-stat-label">Distance</p>
        </div>
        <div class="strava-stat-bordered">
          <p class="strava-stat-value"><span data-strava-secondary-value></span><span class="strava-stat-unit"
              data-strava-secondary-unit></span></p>
          <p class="strava-stat-label" data-strava-secondary-label></p>
        </div>
        <div class="strava-stat">
          <p class="strava-stat-value" data-strava-count></p>
          <p class="strava-stat-label" data-strava-count-label></p>
        </div>
      </div>
      <div>
        <div class="strava-activity-header">
          <div class="strava-activity-bar"></div>
          <p class="strava-activity-label">Recent Activity</p>
        </div>
        <div data-strava-activities>
          <template data-strava-activity-template>
            <div class="strava-activity-row-bordered">
              <div class="strava-activity-left">
                <div class="strava-activity-dot"></div>
                <div>
                  <p class="strava-activity-title"></p>
                  <p class="strava-activity-date"></p>
                </div>
              </div>
              <div class="strava-activity-right">
                <div>
                  <p class="strava-activity-metric-value" data-strava-activity-distance></p>
                  <p class="strava-activity-metric-label">Dist</p>
                </div>
                <div>
                  <p class="strava-activity-metric-value" data-strava-activity-secondary></p>
                  <p class="strava-activity-metric-label" data-strava-activity-secondary-label></p>
                </div>
                <div>
                  <p class="strava-activity-metric-value" data-strava-activity-time></p>
                  <p class="strava-activity-metric-label">Time</p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
      <div class="strava-footer">
        <p class="strava-footer-text">Powered by Strava</p>
      </div>
    </div>
  </div>
</div>
